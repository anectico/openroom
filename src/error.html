<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% · OpenRoom</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f8f7;
				--card: #ffffff;
				--fg: #1a1f1d;
				--muted: #5d6662;
				--border: #e2e5e3;
				--accent: #1f6f5c;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #121513;
					--card: #1a1e1c;
					--fg: #eef1ef;
					--muted: #a3aca8;
					--border: #2c322f;
					--accent: #6fc3ab;
				}
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--fg);
				font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				width: 100%;
				max-width: 28rem;
				padding: 28px 24px;
				border: 1px solid var(--border);
				border-radius: 12px;
				background: var(--card);
				text-align: center;
			}
			.status { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
			h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
			.hint { margin: 0; font-size: 14px; color: var(--muted); }
			footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
		</style>
	</head>
	<body>
		<main>
			<p class="status">Error %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p class="hint">Use your browser's Back button to return to the room.</p>
		</main>
		<footer>OpenRoom by Anectico</footer>
	</body>
</html>
